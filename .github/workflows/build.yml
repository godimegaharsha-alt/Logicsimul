name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup debug keystore
      run: |
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LogicLab-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
        retention-days: 1
      continue-on-error: true

    - name: Publish APK to GitHub Release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v1.0.${{ github.run_number }}"
        gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
          --title "LogicLab Build #${{ github.run_number }}" \
          --notes "Automated build of LogicLab CAD & IC Trainer Kit APK. Note: GitHub Releases do not count against Actions artifact storage quotas." \
          || gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber || true
      continue-on-error: true
